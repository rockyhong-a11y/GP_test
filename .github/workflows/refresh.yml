name: Refresh deck data
env:
  NODE_USE_ENV_PROXY: '1'
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      collection_status: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install public tier table browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Collect public deck data
        id: collect
        continue-on-error: true
        run: node --use-env-proxy scripts/collect.mjs
      - if: always()
        run: npm run validate:data
      - run: npm test
      - name: Commit data only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/decks.json
          git diff --cached --quiet || git commit -m 'data: refresh Hearthstone decks'
          git push
      # A GITHUB_TOKEN push does not start deploy.yml, so this workflow deploys
      # its already-tested working tree directly after a successful collection.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy refreshed data
        id: deployment
        uses: actions/deploy-pages@v4
  report-collection-failure:
    needs: [collect, deploy]
    if: ${{ always() && needs.collect.outputs.collection_status == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '수집에 실패했습니다. 보존된 데이터와 실패 메타데이터는 배포했습니다.' >&2
          exit 1
